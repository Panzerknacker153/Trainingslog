<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mein Trainingslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Eine Spalte, Handy zuerst, feste Tab-Leiste unten. Bewusst nur helles Design. */
  --bg:#f3f4f6; --surface:#ffffff; --ink:#16181d; --muted:#5f6570; --line:#e1e3e8;
  --accent:#8b7cf6; --accent-text:#6d5ce8; --accent-deep:#4334b8; --soft:#ece9f6; --soft2:#d9d3fc;
  --ok:#2b7a3d; --warn:#a85400; --danger:#c0392b; --warmbg:#f7f8fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
@media (display-mode: standalone){body{padding-top:env(safe-area-inset-top)}}
.view{display:none;flex-direction:column;gap:12px;padding-bottom:18px}
.view.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:22px 4px 2px}
.top>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub{font-size:14px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:17px;font-weight:700;margin:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;padding:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:14px;margin:0}
.small{font-size:13px;color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{resize:vertical}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#fff;font-size:19px;min-height:54px;border-radius:14px}
.btn.primary:disabled{opacity:.55}
.btn.soft{background:var(--soft);color:var(--accent-deep)}
.btn.plain{background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn.ghost{background:transparent;border:1.5px dashed #c9ccd3;font-weight:600}
.btn.ghost.acc{border-color:var(--accent);color:var(--accent-text)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--danger);font-weight:600}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.wide{width:100%}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;padding:6px 2px;font-size:15px}
.icon{border:1px solid var(--line);background:transparent;border-radius:10px;width:44px;min-width:44px;height:44px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon.acc{background:var(--soft);border-color:var(--soft);color:var(--accent-text)}
svg.i{width:20px;height:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.acc{background:var(--soft);border-color:var(--soft);color:var(--accent-deep)}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip svg{width:14px;height:14px}
.hero{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;border:0;border-radius:18px;background:var(--accent);color:#fff;text-align:left;width:100%}
.hero .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.hero b{font-size:19px;display:block}
.hero span{font-size:14px;opacity:.95}
.planbtn{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.ini{width:44px;height:44px;border-radius:12px;background:var(--bg);color:var(--muted);font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
.ini.acc{background:var(--soft);color:var(--accent-text)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow b{font-size:17px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile.acc{background:var(--soft);border-color:var(--soft)}
.tile .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t{font-size:12px;color:var(--muted)}
.tile .d{font-size:12px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--danger)}
/* Übungskarte */
.ex.ss{border-color:var(--accent);border-width:1.5px}
.exhead{display:flex;gap:8px;align-items:center}
.exname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.exname b{font-size:18px;font-weight:700;line-height:1.2}
.hint{margin:0;font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:7px 10px}
.hint b{color:var(--ink);font-weight:600}
.sethead,.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.sethead.int,.set.int{grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 44px 42px 44px;gap:5px}
.rirgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.rirgrid button{min-height:60px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-family:var(--display);font-weight:700;font-size:28px}
.rirgrid button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rirb{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.rirb.empty{color:#a3a8b0;font-weight:500}
.rirb.need{border:1.5px dashed var(--accent);color:var(--accent-text)}
.pct{font-size:14px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent-deep)}
.pct.ph{color:#a3a8b0;font-weight:500}
.iz-lo{color:#8a8f98}.iz-ka{color:#1f6fb8}.iz-hy{color:#2b7a3d}.iz-mk{color:#c25e00}
.pct .ph{font-weight:500;opacity:.6}
.izt.iz-ka{background:#e6f0fa;border-color:#c4dbf1}.izt.iz-hy{background:#e5f3e8;border-color:#bfe0c7}.izt.iz-mk{background:#fdeedf;border-color:#f5cfa6}.izt.iz-lo{background:#f1f2f4}
.izt .t b{font-weight:700}
.sl.iz{font-weight:600}
.izlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.izlegend span{display:inline-flex;align-items:center;gap:5px}
.izlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.set.warm .pct span{color:#8a8f98!important;font-weight:500}
.sethead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.badge{height:40px;border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);border-radius:10px;padding:0}
.badge.w{font-family:var(--body);font-size:12px;background:#eef0f3;height:28px;align-self:center}
.badge.d{font-family:var(--body);font-size:12px;background:#fde7e4;color:#a33a2c;height:28px;align-self:center}
.set input{text-align:center;font-size:19px;font-variant-numeric:tabular-nums;padding:8px 4px}
.set.warm input{background:var(--warmbg);border-style:dashed;border-color:#d4d7dd;color:var(--muted);font-size:18px}
.set.isdone input{background:#fff}
.done{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#c9ccd3;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.done.on{background:var(--accent);border-color:var(--accent);color:#fff}
.set.warm .done.on{background:#9aa0aa;border-color:#9aa0aa}
.done .pr{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#f5b400;color:#3a2a00;display:flex;align-items:center;justify-content:center}
.done .pr svg{width:12px;height:12px}
.exbtns{display:flex;gap:8px;flex-wrap:wrap}
.sslink{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-text);margin:-6px 0}
.sslink svg{width:16px;height:16px}
.editing{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* Bewertung */
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--display);font-weight:700;font-size:22px}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Verlauf */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e6e8ec;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;padding:0 10px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.month{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 4px 0;font-weight:600}
.wcard{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.wcard .row b{font-size:17px}
.rchip{font-size:13px;font-weight:700;color:var(--accent-deep);background:var(--soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dh{font-size:12px;color:var(--muted);font-weight:600}
.cal button{height:42px;border:0;border-radius:10px;background:transparent;font-size:15px;font-variant-numeric:tabular-nums;padding:0;position:relative}
.cal button.has{background:var(--soft);color:var(--accent-deep);font-weight:700}
.cal button.sel{background:var(--accent);color:#fff;font-weight:700}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.fut{color:#8a8f98}
.detex{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.detex .row b{font-size:16px}
.setline{display:flex;flex-wrap:wrap;gap:6px}
.sl{font-size:14px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:3px 8px}
.sl.w{color:var(--muted)} .sl.pr{background:#fff3cc}
/* Listen */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
.li .r{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Balken */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px}
.fill.lo{background:#c9c2f7}
.fill.hi{background:#e6a23c}
.fill.hs-red{background:#d64545}.fill.hs-green{background:#2b8a4f}.fill.hs-orange{background:#e8870e}
.zone{position:absolute;top:0;bottom:0;background:rgba(43,122,61,.13);border-left:1.5px solid rgba(43,122,61,.5);border-right:1.5px solid rgba(43,122,61,.5)}
.pie{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.pie svg{width:150px;height:150px;display:block}
.pielegend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pielegend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 28px;gap:8px;align-items:center;font-size:14px}
.pielegend li i{width:12px;height:12px;border-radius:3px;display:block}
.pielegend li b{font-variant-numeric:tabular-nums}
.pielegend li .small{text-align:right;font-variant-numeric:tabular-nums}
.pielegend li.zero{opacity:.45}
@media (max-width:360px){.pie{grid-template-columns:1fr;justify-items:center}}
.bwform{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.bwform label{display:flex;flex-direction:column;gap:4px}
.hs{border-color:#d9d3fc}
.hsmain{display:flex;gap:14px;align-items:center}
.hsmain .gauge{width:140px;height:140px;flex:none}
.hsmain .grow{gap:6px}
.hsband{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.hsbars{display:flex;flex-direction:column;gap:9px}
.hsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;font-size:14px}
.hsrow .track{grid-column:1 / -1;height:8px}
.hsrow b{font-variant-numeric:tabular-nums}
.hstip{text-align:left;background:var(--soft);border:0;border-radius:10px;padding:9px 12px;font-size:14px;color:var(--ink)}
@media (max-width:360px){.hsmain{flex-direction:column;align-items:flex-start}}
.hchip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 6px}
.hchip svg{width:15px;height:15px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.effb{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px 3px 6px;white-space:nowrap}
.effb svg{width:15px;height:15px}
.effb.ef-lo{background:#fdeedf;color:#a85400}.effb.ef-mid{background:#e6f0fa;color:#1f6fb8}.effb.ef-hi{background:#e0f4ec;color:#0f7a55}
.effcard.ef-lo{border-color:#f5cfa6}.effcard.ef-mid{border-color:#c4dbf1}.effcard.ef-hi{border-color:#a9dcc6}
.effbig{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.effcard.ef-lo .effbig{color:#a85400}.effcard.ef-mid .effbig{color:#1f6fb8}.effcard.ef-hi .effbig{color:#0f7a55}
.histctl{gap:8px;padding:10px 12px}
.balpies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.balpie{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px}
.balpie svg{width:120px;height:120px}
.ballegend{display:flex;flex-direction:column;gap:3px;font-size:13px;align-items:flex-start}
.ballegend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.wheelbox{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px;margin:4px 0}
.wband{position:absolute;left:12px;right:12px;top:88px;height:44px;border-radius:12px;background:var(--soft);pointer-events:none}
.wheel{position:relative;height:220px;width:96px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);outline:none}
.wheel::-webkit-scrollbar{display:none}
.wheel.narrow{width:56px}
.wheel:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:12px}
.wpad{height:88px}
.wi{height:44px;line-height:44px;text-align:center;font-size:24px;font-variant-numeric:tabular-nums;color:#a3a8b0;scroll-snap-align:center;cursor:pointer;font-family:var(--display);font-weight:600}
.wi.on{color:var(--ink);font-size:30px;font-weight:700}
.wsep,.wunit{position:relative;font-family:var(--display);font-weight:700;font-size:30px;color:var(--ink)}
.wunit{font-size:20px;color:var(--muted);margin-left:2px}
.wval{text-align:center;font-weight:700;font-size:15px;color:var(--accent-deep)}
.wcard2{flex-direction:row;align-items:flex-start;gap:12px}
.daycirc{width:52px;height:52px;flex:none;border-radius:50%;background:var(--soft);color:var(--accent-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.daycirc .dwd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.daycirc .dnum{font-family:var(--display);font-weight:700;font-size:24px;margin-top:1px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.prstar{color:#e0a800;display:flex}
.progchip{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px 3px 6px;background:#eef0f3;color:var(--muted);white-space:nowrap}
.progchip svg{width:14px;height:14px}
.progchip.up{background:#e0f4ec;color:#0f7a55}.progchip.down{background:#fdeaea;color:#b03030}
.prstar svg{width:18px;height:18px;fill:#f5c000;stroke:#d39a00}
.wbody2{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.wbody2 b{font-size:17px}
.wex{display:flex;flex-direction:column;gap:1px;font-size:13.5px;color:#8a8f98;line-height:1.35}
.wside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;padding-top:2px}
.wdur{font-size:13px;color:#8a8f98;white-space:nowrap}
.mhead{display:flex;justify-content:space-between;align-items:baseline}
.mcount{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-text);font-weight:600}
.toprecs{display:flex;flex-direction:column;gap:6px}
.toprec{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:var(--bg);border:0;border-radius:12px;padding:8px 12px}
.toprec .trank{grid-row:1 / 3;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent-deep);font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.toprec:first-child .trank{background:#fff3cc;color:#8a6500}
.toprec .tval{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.dexcard{gap:8px}
.dhright{display:flex;align-items:center;gap:8px;flex:none}
.ddur{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.ddur svg{width:16px;height:16px}
.dsets{display:flex;flex-direction:column}

<script>
/* Trainingslog · GitHub-Version */
const APP_VERSION = "2026-11-24";
window.addEventListener("error", e => showFatal(e.message + (e.lineno ? " (Zeile " + e.lineno + ")" : "")));
window.addEventListener("unhandledrejection", e => showFatal(String(e.reason && e.reason.message || e.reason)));
function showFatal(msg){
  try{
    let b = document.getElementById("fatal");
    if(!b){ b = document.createElement("div"); b.id = "fatal"; b.style.cssText = "position:fixed;left:12px;right:12px;top:12px;z-index:999;background:#fff1f0;border:1px solid #e0a5a0;color:#7a1f17;border-radius:12px;padding:12px 14px;font:14px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.15)"; document.body.appendChild(b); }
    b.innerHTML = "<b>Fehler in der App</b><br>" + String(msg).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])) + "<br><small>Version " + APP_VERSION + " · Schick diese Meldung an Claude.</small>";
  }catch(_){}
}
/* =========================================================
   Grundlagen
   ========================================================= */
const $ = s => document.querySelector(s);
const ICONS = {

};
function icon(n, cls="i"){ return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ymd(new Date()); }
function parseD(s){ const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function addDays(d,n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function num(v){ if(v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function parseTime(v){ if(v === "" || v == null) return null; const s = String(v).trim(); if(s.includes(":")){ const [m,sec] = s.split(":"); const r = (parseInt(m)||0)*60 + (parseInt(sec)||0); return r > 0 ? r : null; } const n = num(s); return n != null && n > 0 ? Math.round(n) : null; }
function fmt(n, d=1){ return n == null || !isFinite(n) ? "–" : Number(n).toLocaleString("de-DE", {maximumFractionDigits:d}); }
function fmtKg(n){ if(n == null) return "–"; return n >= 10000 ? fmt(n/1000,1)+" t" : fmt(n,0)+" kg"; }
function fmtSec(s){ if(s == null) return "–"; s = Math.round(s); return s >= 60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" min" : s+" s"; }
function fmtDate(s, o={weekday:"short", day:"numeric", month:"short"}){ return parseD(s).toLocaleDateString("de-DE", o); }
function fmtShort(s){ return parseD(s).toLocaleDateString("de-DE", {day:"numeric", month:"numeric"}); }
function longDate(d){ return d.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"}); }

/* =========================================================

const GROUPS = ["Bauch","Beine","Bizeps","Brust","Rücken","Schultern","Trizeps"];
const CAT_RAW = `Bankdrücken|Brust|push|w

L-Sit|Bauch|core|t

const CATALOG = CAT_RAW.split("\n").map(l => { const [name, group, pattern, m] = l.split("|"); return {name, group, pattern, m}; });
const CATMAP = new Map(CATALOG.map(e => [key(e.name), e]));
const PATTERN_FOR_GROUP = {Brust:"push", Rücken:"pull", Schultern:"push", Bizeps:"pull", Trizeps:"push", Beine:"legs", Bauch:"core"};
/* alte Kategorien (Arme, Core) auf die neuen abbilden */
function normGroup(g, pattern){ if(g === "Core") return "Bauch"; if(g === "Arme") return pattern === "pull" ? "Bizeps" : "Trizeps"; return g; }

function ingest(docs){
  DB.ids = docs.map(d => d.id);

  for(const d of docs){
    if(d.kind === "w" && d.date && Array.isArray(d.exercises)) w.push(d);
    else if(d.kind === "p" && Array.isArray(d.items)) p.push(d);
    else if(d.kind === "bw" && d.date && d.kg > 0) b.push(d);
    else if(d.id === "settings") settings = d;
    else if(d.id === "active" && d.kind === "active") active = d;
  }
  w.sort((a,b) => b.date.localeCompare(a.date) || (b.startedAt||0) - (a.startedAt||0));
  p.sort((a,b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
  b.sort((a,b) => a.date.localeCompare(b.date));

  if(settings) S.settings = {weeklyGoal:3, formula:"epley", customEx:[], ...settings};

    DB.activeAdopted = true;

function e1rm(w, r){

const isWork = s => s.type !== "w";
/* Körpergewichtsübungen: bewegte Last = Körpergewicht × Anteil + Zusatzgewicht */

function bwFactor(name){
  if(!name || isTime(name)) return 0;
  const c = (S.settings.customEx || []).find(e => key(e.name) === key(name));
  if(c) return c.bw ? 1 : 0;
  return BW_FACTOR[key(name)] || 0;
}
function bwOn(date){
  if(!S.bw.length) return null;

  return v ?? S.bw[0].kg;
}
function loadOf(s, name, date){
  const f = bwFactor(name), ext = s.w > 0 ? s.w : 0;

  const bw = bwOn(date); return (bw ? bw*f : 0) + ext;

/* Einseitige Übungen (einarmig/einbeinig): Wiederholungen gelten pro Seite, das Volumen zählt doppelt */
function isUni(name){

  if(c && c.uni) return true;
  return (S.settings.uniEx || []).includes(k);
}
function setVol(s, name, date){ const L = name ? loadOf(s, name, date) : (s.w || 0); return (L > 0 && s.r > 0) ? L * s.r * (isUni(name) ? 2 : 1) : 0; }
function wStats(w){
  let vol = 0, work = 0, warm = 0, reps = 0, time = 0, prs = 0;

    if(s.type === "w"){ warm++; continue; }
    work++; const sv = setVol(s, ex.name, w.date); vol += sv; if(sv > 0) reps += s.r; if(s.t) time += s.t; if(s.pr) prs++;

}

/* Level-Kurve: für den Schritt von Level L auf L+1 braucht es 500 + L × 150 XP */

/* =========================================================
   Diagramme
   ========================================================= */
const CH = {};
function chart(id, pts, o = {}){
  CH[id] = {pts, o, sel: CH[id] && CH[id].pts.length === pts.length ? CH[id].sel : null};
  const valid = pts.filter(p => p.y != null);
  if(!valid.length) return `<p class="muted">${o.empty || "In diesem Zeitraum gibt es noch keine Daten."}</p>`;
  if(o.type !== "bar" && valid.length < 2) return `<p class="muted">Ab zwei Werten siehst du hier eine Kurve. Bisher: <b>${o.fmt(valid[0].y)}</b> (${esc(valid[0].label)}).</p>`;
  return `<div class="chart" data-chart="${id}" role="img" aria-label="${esc(o.aria || "Diagramm")}">${chartSVG(id)}</div><div class="chart-cap" id="cap-${id}">${capText(id)}</div>${o.noTrend ? "" : trendText(id)}`;
}
function selIdx(id){ const c = CH[id]; if(c.sel != null) return c.sel; for(let i = c.pts.length-1; i >= 0; i--) if(c.pts[i].y != null) return i; return 0; }
/* Lineare Trendlinie (kleinste Quadrate) über alle Punkte mit Wert */
/* Geglättete Trendkurve (LOWESS: gewichtete lokale Regression) über alle Punkte mit Wert */
function trendOf(pts){
  const xs = [], ys = [];
  pts.forEach((p, i) => { if(p.y != null) { xs.push(i); ys.push(p.y); } });
  const n = xs.length; if(n < 3) return null;
  const fit = [];
  if(n <= 4){ // bei wenigen Punkten: gerade Ausgleichslinie
    const mx = avg(xs), my = avg(ys); let num = 0, den = 0;
    for(let i = 0; i < n; i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)**2; }
    const sl = den ? num/den : 0; for(const x of xs) fit.push(my + sl*(x - mx));
    return { xs, fit, x0: xs[0], x1: xs[n-1], slope: sl };
  }
  const span = n <= 6 ? 1 : Math.max(0.5, 5/n); // Anteil der Nachbarn je Punkt
  const k = Math.max(3, Math.ceil(span*n));
  for(let a = 0; a < n; a++){
    const dists = xs.map(x => Math.abs(x - xs[a])).sort((p, q) => p - q), h = Math.max(dists[k-1], 1e-9) * 1.25; // breiteres Fenster = ruhigere Kurve, folgt nicht jedem Endpunkt
    let sw = 0, swx = 0, swy = 0, swxx = 0, swxy = 0;
    for(let b = 0; b < n; b++){ const u = Math.abs(xs[b] - xs[a]) / h; if(u >= 1) continue; const w = Math.pow(1 - u*u*u, 3); sw += w; swx += w*xs[b]; swy += w*ys[b]; swxx += w*xs[b]*xs[b]; swxy += w*xs[b]*ys[b]; }
    const den = sw*swxx - swx*swx;
    fit.push(Math.abs(den) < 1e-12 ? swy/sw : (swy*swxx - swx*swxy)/den + ((sw*swxy - swx*swy)/den) * xs[a]);
  }
  return { xs, fit, x0: xs[0], x1: xs[n-1], slope: (fit[n-1] - fit[0]) / (xs[n-1] - xs[0] || 1) };
}
function trendText(id){
  const c = CH[id], t = trendOf(c.pts); if(!t) return "";
  const vals = c.pts.map(p => p.y).filter(v => v != null), range = Math.max(...vals) - Math.min(...vals) || Math.abs(avg(vals)) || 1;
  const flat = Math.abs(t.slope*(t.x1 - t.x0)) < Math.max(range*0.15, Math.abs(avg(vals))*0.01);
  const dir = flat ? "stabil" : t.slope > 0 ? "steigend" : "fallend";
  const unit = c.o.trendUnit || "Schritt";
  return `<span class="trendtxt"><i class="lg-line"></i>Verlauf <i class="lg-trend"></i>Trend: <b>${dir}</b>${flat ? "" : ` (${t.slope > 0 ? "+" : "−"}${esc(c.o.fmt(Math.abs(t.slope)))} pro ${esc(unit)})`}</span>`;
}
function capText(id){ const c = CH[id], p = c.pts[selIdx(id)]; if(!p) return ""; return `${esc(p.label)}: <b>${p.y == null ? "–" : c.o.fmt(p.y)}</b>${p.sub ? " · " + esc(p.sub) : ""}${p.wid && S.workouts.some(w => w.id === p.wid) ? ` <button class="link caplink" data-act="chart-open" data-id="${esc(p.wid)}">Training öffnen ›</button>` : ""}`; }
function openWorkoutFromChart(wid){
  S.ddBack = S.dd ? {...S.dd} : null; S.dd = null;
  openSheet(() => renderWorkoutDetail(wid));
}
const CW = 340, CHH = 172, PL = 42, PR = 10, PT = 14, PB = 24;
/* Runde Achseneinteilung: Schrittweite 1, 2 oder 5 × 10^n, höchstens 5 Linien.
   Liegt der kleinste/größte Wert genau auf einer Linie, kommt eine Linie Luft dazu (120 → ab 100, 180 → bis 200). */
function niceAxis(lo, hi, opt = {}){
  if(hi === lo){ hi = lo + (Math.abs(lo) || 1) * 0.1; if(!opt.fixedLo) lo = lo - (Math.abs(lo) || 1) * 0.1; }
  if(lo < 0 && hi >= 0 && !opt.fixedLo) lo = Math.min(lo, 0);
  const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / 4)) - 1);
  const minStep = opt.minStep ?? 1;
  for(let m = mag; m < span * 100; m *= 10) for(const f of [1, 2, 5]){
    const step = f * m; if(step < minStep) continue;
    let y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    if(!opt.fixedLo && Math.abs(y0 - lo) < step * 1e-9 && lo > 0) y0 -= step;
    if(!opt.fixedHi && Math.abs(y1 - hi) < step * 1e-9) y1 += step;
    if(lo >= 0 && y0 < 0) y0 = 0;
    const n = Math.round((y1 - y0) / step) + 1;
    if(n <= 5){ const ticks = []; for(let k = 0; k < n; k++) ticks.push(+(y0 + k*step).toFixed(10)); return {y0, y1, step, ticks}; }
  }
  return {y0: lo, y1: hi, step: span, ticks: [lo, hi]};
}
/* Glatte Kurve (Catmull-Rom → Bézier) durch die Punkte */
function smoothPath(p){
  if(p.length < 2) return p.length ? `M${p[0][0]},${p[0][1]}` : "";
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i = 0; i < p.length-1; i++){
    const p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2, k = 0.12;
    const c1x = p1[0] + (p2[0]-p0[0])*k, c1y = p1[1] + (p2[1]-p0[1])*k, c2x = p2[0] - (p3[0]-p1[0])*k, c2y = p2[1] - (p3[1]-p1[1])*k;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function chartSVG(id){
  const {pts, o} = CH[id];
  const vals = pts.map(p => p.y).filter(v => v != null);
  let lo = (o.type === "bar" || o.zero) ? 0 : Math.min(...vals), hi = Math.max(...vals);
  if(o.band){ lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
  if(o.min != null) lo = Math.min(lo, o.min);
  if(o.max != null) hi = Math.max(hi, o.max);
  const ax = niceAxis(lo, hi, {fixedLo: o.type === "bar" || o.zero || o.min != null, fixedHi: o.max != null, minStep: o.minStep});
  const y0 = ax.y0, y1 = ax.y1;
  const n = pts.length, slot = (CW-PL-PR)/n, X = i => PL + slot*(i+0.5);
  const Y = v => PT + (1 - (v-y0)/(y1-y0)) * (CHH-PT-PB);
  const sel = selIdx(id);
  const ticks = ax.ticks;
  /* dezentes Raster: feine Linien, Beschriftung in Grau */
  let g = ticks.map((t, k) => `<line x1="${PL}" x2="${CW-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="${k === 0 ? "#dfe2e7" : "#eef0f3"}" stroke-width="1"/><text x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a8f98">${esc((o.tick || o.fmt)(t))}</text>`).join("");
  if(o.band) g += `<rect x="${PL}" width="${CW-PL-PR}" y="${Y(o.band[1]).toFixed(1)}" height="${(Y(o.band[0])-Y(o.band[1])).toFixed(1)}" fill="#2b7a3d" opacity=".07" rx="3"/>`;
  if(pts[sel] && pts[sel].y != null) g += `<line x1="${X(sel).toFixed(1)}" x2="${X(sel).toFixed(1)}" y1="${PT}" y2="${CHH-PB}" stroke="#c9c2f7" stroke-width="1"/>`;
  if(o.type === "bar"){
    const bw = Math.min(18, slot*0.55);
    pts.forEach((p,i) => { if(p.y == null) return; const y = Y(p.y), hgt = Math.max(Y(y0) - y, 1.5); g += `<rect x="${(X(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${Math.min(4, bw/2).toFixed(1)}" fill="${i===sel ? "#b2a6fa" : "#e4defd"}"/>`; });
  } else {
    const idx = pts.map((p,i) => p.y != null ? i : -1).filter(i => i >= 0);
    const P = idx.map(i => [X(i), Y(pts[i].y)]);
    g += `<path d="${smoothPath(P)}" fill="none" stroke="#b2a6fa" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(idx.length <= 40) idx.forEach(i => { if(i === sel) return; const pc = o.ptColor ? o.ptColor(pts[i].y) : "#b2a6fa"; g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i].y).toFixed(1)}" r="2.4" fill="${pc}"/>`; });
  }
  /* Trendlinie: kräftig in Lila */
  const tr = o.noTrend ? null : trendOf(pts);
  if(tr){ const P2 = tr.xs.map((x, j) => [X(x), Math.max(PT, Math.min(CHH-PB, Y(tr.fit[j])))]); g += `<path d="${smoothPath(P2)}" fill="none" stroke="#6d5ce8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`; }
  /* ausgewählter Punkt */
  if(o.type !== "bar" && pts[sel] && pts[sel].y != null){ const pc = o.ptColor ? o.ptColor(pts[sel].y) : "#6d5ce8"; g += `<circle cx="${X(sel).toFixed(1)}" cy="${Y(pts[sel].y).toFixed(1)}" r="5" fill="#fff" stroke="${pc}" stroke-width="2"/>`; }
  g += `<text x="${X(0).toFixed(1)}" y="${CHH-6}" text-anchor="${n===1?"middle":"start"}" font-size="10" fill="#8a8f98">${esc(pts[0].label)}</text>`;
  if(n > 1) g += `<text x="${X(n-1).toFixed(1)}" y="${CHH-6}" text-anchor="end" font-size="10" fill="#8a8f98">${esc(pts[n-1].label)}</text>`;
  return `<svg viewBox="0 0 ${CW} ${CHH}" aria-hidden="true">${g}</svg>`;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-chart]"); if(!el) return;
  const id = el.dataset.chart, c = CH[id]; if(!c) return;
  const r = el.getBoundingClientRect(); const vx = (e.clientX - r.left) / r.width * CW;
  const slot = (CW-PL-PR)/c.pts.length;
  let i = Math.floor((vx-PL)/slot); i = Math.max(0, Math.min(c.pts.length-1, i));
  if(c.sel === i && c.pts[i] && c.pts[i].wid && S.workouts.some(w => w.id === c.pts[i].wid)){ openWorkoutFromChart(c.pts[i].wid); return; }
  c.sel = i; el.innerHTML = chartSVG(id); const cap = document.getElementById("cap-"+id); if(cap) cap.innerHTML = capText(id);
});

const RATE_SHORT = {1:"sehr leicht",2:"leicht",3:"locker",4:"moderat",5:"mittel",6:"etwas fordernd",7:"fordernd",8:"hart",9:"sehr hart",10:"maximal"};
/* Ø prozentuale Veränderung pro Übung: diese Einheit vs. vorherige Einheit derselben Übung */
function workoutProgress(w){
  const changes = [];
  for(const ex of w.exercises){
    const ss = exSessions(ex.name), i = ss.findIndex(s => s.wid === w.id);
    if(i < 1) continue;
    const t = isTime(ex.name), cur = t ? ss[i].bestT : ss[i].best1, prev = t ? ss[i-1].bestT : ss[i-1].best1;
    if(cur && prev) changes.push((cur/prev - 1) * 100);
  }
  return changes.length ? avg(changes) : null;
}
/* Relative Intensität: Arbeitsgewicht in % des besten geschätzten 1RM der Übung bis einschließlich dieses Trainings */
function ref1RM(name, wid, list = S.workouts){
  const ss = exSessions(name, list), i = ss.findIndex(s => s.wid === wid);
  const arr = i < 0 ? ss : ss.slice(0, i+1);
  const b = Math.max(0, ...arr.map(s => s.best1 || 0));
  return b || null;
}
function workoutIntensity(w, list = S.workouts){
  const vals = [];
  for(const ex of w.exercises){
    if(isTime(ex.name)) continue;
    const ref = ref1RM(ex.name, w.id, list); if(!ref) continue;
    for(const s of ex.sets) if(isWork(s) && s.w > 0) vals.push(s.w / ref * 100);
  }
  return vals.length ? avg(vals) : null;
}
function histBest1(name, excludeId){
  let b = 0; const k = key(name);
  for(const w of S.workouts){ if(w.id === excludeId) continue; for(const ex of w.exercises) if(key(ex.name) === k) for(const s of ex.sets) if(isWork(s)){ const e = e1rm(s.w, s.r) || 0; if(e > b) b = e; } }
  return b || null;
}

/* RIR-Vorauswahl: Wert aus dem letzten Training dieser Übung, sonst 2 (Aufwärmsätze haben kein RIR) */
function newSet(type, hint = {}){ return {type, w:"", r:"", t:"", rir: type === "w" ? "" : String(hint.hrir ?? "2"), done:false, hw:hint.hw ?? "", hr:hint.hr ?? "", ht:hint.ht ?? ""}; }
function hintFromLast(name, idx){
  const last = lastFor(name); if(!last) return {hrir:"2"};
  const work = last.sets.filter(isWork); const s = work[Math.min(idx, work.length-1)]; if(!s) return {hrir:"2"};
  const rirs = work.filter(x => x.rir != null), lastRir = s.rir != null ? s.rir : rirs.length ? rirs[rirs.length-1].rir : 2;
  return { hw: s.w != null ? String(s.w).replace(".",",") : "", hr: s.r != null ? String(s.r) : "", ht: s.t != null ? String(s.t) : "", hrir: String(lastRir) };
}
function newExercise(name, plan){
  const t = isTime(name);
  const sets = [];
  if(plan){
    for(let i = 0; i < (plan.warm||0); i++) sets.push(newSet("w"));
    for(let i = 0; i < Math.max(1, plan.sets||1); i++){ const h = hintFromLast(name, i); if(plan.reps){ if(t) h.ht = String(plan.reps); else h.hr = String(plan.reps); } sets.push(newSet("n", h)); }
  } else sets.push(newSet("n", hintFromLast(name, 0)));
  return {name, note:"", showNote:false, ss:false, sets};
}

  gateVal = {i: Math.floor(clamped), d: Math.round((clamped - Math.floor(clamped))*10) % 10};
  const ints = []; for(let v = WH_MIN; v <= WH_MAX; v++) ints.push(v);

    <button class="btn primary wide" data-act="gate-go" data-plan="${plan ? esc(plan.id) : ""}">Speichern und Training starten</button>`);
  setTimeout(() => {

function markWheel(w){
  const idx = Math.round(w.scrollTop / WH_ROW), items = w.querySelectorAll(".wi");
  items.forEach((el, k) => el.classList.toggle("on", k === idx));
  const it = items[Math.max(0, Math.min(items.length-1, idx))]; if(!it) return;
  if(w.id === "wh-int") gateVal.i = +it.dataset.v; else gateVal.d = +it.dataset.v;
  const out = $("#gate-val"); if(out) out.textContent = `${gateVal.i},${gateVal.d} kg`;
}
let wheelT = null;
document.addEventListener("scroll", e => {
  const w = e.target; if(!(w && w.classList && w.classList.contains("wheel"))) return;
  markWheel(w);
  clearTimeout(wheelT); wheelT = setTimeout(() => { const idx = Math.round(w.scrollTop / WH_ROW); w.scrollTo({top: idx * WH_ROW, behavior:"smooth"}); }, 120);
}, true);
document.addEventListener("click", e => {
  const it = e.target.closest(".wheel .wi"); if(!it) return;

async function gateGo(planId){

  const d = todayStr();
  put("bw-" + d, {kind:"bw", date:d, kg}).catch(e => toast(failMsg(e)));

}

function priorBest(name, excludeId, skipSet){

/* Hat das Training einen PR? (live markiert oder nachträglich erkannt) */
const PR_CACHE = new Map();
function workoutHasPR(w){
  if(wStats(w).prs > 0) return true;
  const ck = w.id + ":" + (w.updatedAt||0) + ":" + S.workouts.length;
  if(PR_CACHE.has(ck)) return PR_CACHE.get(ck);
  let pr = false;
  for(const ex of w.exercises){
    const ss = exSessions(ex.name), i = ss.findIndex(s => s.wid === w.id);
    if(i < 1) continue;
    const prev = ss.slice(0, i), c = ss[i];
    const pW = Math.max(0, ...prev.map(s => s.maxW || 0)), pE = Math.max(0, ...prev.map(s => s.best1 || 0)), pT = Math.max(0, ...prev.map(s => s.bestT || 0));
    if((c.maxW || 0) > pW && pW > 0 || (c.best1 || 0) > pE + 0.05 && pE > 0 || (c.bestT || 0) > pT && pT > 0){ pr = true; break; }
  }
  if(PR_CACHE.size > 500) PR_CACHE.clear();
  PR_CACHE.set(ck, pr); return pr;
}

async function doExport(t){
  const data = t === "csv" ? buildCSV() : JSON.stringify({exportiert: new Date().toISOString(), trainings:S.workouts, plaene:S.plans, koerpergewicht:S.bw, einstellungen:S.settings}, null, 1);
  const filename = `trainingslog-${todayStr()}.${t}`;
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ await dl.save({filename, data}); toast("Export bereit."); return; }catch(e){ if(e && /declin|cancel|abort/i.test(String(e.code||e.message||""))) return; } }
  const type = t === "csv" ? "text/csv" : "application/json";
  try{
    const file = new File([data], filename, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Datei wird gespeichert."); return;
  }catch(e){}
  try{ await navigator.clipboard.writeText(data); toast("Download nicht möglich. Die Daten wurden stattdessen in die Zwischenablage kopiert."); }
  catch(e){ toast("Export wird hier nicht unterstützt. Öffne die App im Browser und versuch es erneut."); }
}

  return `<section class="card effcard ${cls}"><div class="row"><h3>Trainingseffizienz</h3><span class="effbig">${e.total} %</span></div>
    ${e.parts.map(p => { const pc = p.pts/p.max; return `<div class="hsrow"><span>${esc(p.name)}</span><b>${fmt(p.pts,0)}/${p.max}</b><span class="track"><span class="fill" style="width:${(pc*100).toFixed(0)}%;background:${pc >= 0.8 ? "#0f7a55" : pc >= 0.5 ? "#1f6fb8" : "#c25e00"}"></span></span><span class="small" style="grid-column:1 / -1">${esc(p.detail)}</span></div>`; }).join("")}
    <span class="small">Nur Arbeits- und Dropsätze zählen. Intensität 30 · RIR 30 · Volumen 20 · Overload 20 Punkte.</span></section>`;
}
let wiping = false;
async function wipeAll(){
  if(wiping) return;
  const n = S.workouts.length, p = S.plans.length, b = S.bw.length;
  if(!(await ask(`Alle Daten löschen? Das betrifft ${n} ${plural(n,"Training","Trainings")}, ${p} ${plural(p,"Plan","Pläne")}, ${b} Körpergewicht-${plural(b,"Eintrag","Einträge")} sowie Einstellungen, Level und Abzeichen.`, "Weiter"))) return;
  if(!(await ask("Letzte Bestätigung: Das kann nicht rückgängig gemacht werden. Wirklich alles endgültig löschen?", "Endgültig löschen"))) return;
  wiping = true;
  try{
    clearTimeout(activeTimer); S.active = null; S.trainView = "main"; S.planEdit = null; lsDel("tl2-active");
    if(DB.mode === "cloud"){
      const ids = [...new Set([...(DB.ids || []), "settings", "active"])];
      let done = 0;
      for(const id of ids){ try{ await withRetry(() => DB.col.doc(id).delete()); }catch(e){ throw e; } done++; if(done % 10 === 0) toast(`Lösche … ${done} von ${ids.length}`); }
    } else {
      DB.local = {}; lsDel("tl2-docs");
      ingest([]);
    }
    S.settings = {weeklyGoal:3, formula:"epley", customEx:[]};
    S.workouts = []; S.plans = []; S.bw = []; EFF_CACHE = new Map();
    closeSheet(); renderAll(); showTab("train");
    toast("Alle Daten wurden gelöscht.");
  }catch(e){ toast("Löschen hat nicht vollständig geklappt. " + failMsg(e)); }
  finally{ wiping = false; }
}
function exportCard(){ return `<section class="card"><h3>Daten sichern</h3><p class="muted">Sichere alle Daten als JSON-Backup (z. B. in iCloud Drive) oder als CSV für Excel. Mit dem Backup holst du alles auf ein neues Handy zurück.</p>
    <div class="exbtns"><button class="btn plain sm" data-act="export" data-t="json">${icon("dl")} Backup (JSON)</button><button class="btn plain sm" data-act="export" data-t="csv">${icon("dl")} CSV</button></div>
    <label class="btn soft sm" for="import-file" style="align-self:flex-start;cursor:pointer">${icon("up")} Backup wiederherstellen</label>
    <input type="file" id="import-file" accept=".json,application/json" style="position:absolute;left:-9999px"></section>`; }
async function importBackup(file){
  let d;
  try{ d = JSON.parse(await file.text()); }catch(e){ toast("Die Datei ist kein gültiges Backup (JSON)."); return; }
  const tr = Array.isArray(d.trainings) ? d.trainings : [], pl = Array.isArray(d.plaene) ? d.plaene : [], bw = Array.isArray(d.koerpergewicht) ? d.koerpergewicht : [];
  if(!tr.length && !pl.length && !bw.length && !d.einstellungen){ toast("In dieser Datei wurden keine Trainingsdaten gefunden."); return; }
  if(!(await ask(`Backup einspielen? ${tr.length} ${plural(tr.length,"Training","Trainings")}, ${pl.length} ${plural(pl.length,"Plan","Pläne")} und ${bw.length} Körpergewicht-Einträge. Vorhandene Daten bleiben erhalten, gleiche Einträge werden überschrieben.`, "Einspielen"))) return;
  const docs = [];
  for(const w of tr) if(w && w.date && Array.isArray(w.exercises)){ const {id, ...rest} = w; docs.push([id && /^w-/.test(id) ? id : "w-" + (id || uid()), {...rest, kind:"w"}]); }
  for(const p of pl) if(p && Array.isArray(p.items)){ const {id, ...rest} = p; docs.push([id && /^p-/.test(id) ? id : "p-" + (id || uid()), {...rest, kind:"p"}]); }
  for(const b of bw) if(b && b.date && b.kg > 0) docs.push(["bw-" + b.date, {kind:"bw", date:b.date, kg:b.kg}]);
  if(d.einstellungen && typeof d.einstellungen === "object"){ const {id, updatedAt, ...rest} = d.einstellungen; docs.push(["settings", {...S.settings, ...rest, kind:"settings"}]); }
  try{
    if(DB.mode === "cloud"){ for(const [id, body] of docs) await put(id, body); }
    else { const now = Date.now(); for(const [id, body] of docs) DB.local[id] = {...body, updatedAt: now}; lsSet("tl2-docs", DB.local); ingest(Object.entries(DB.local).map(([id, x]) => ({id, ...x}))); }
    toast(`Backup eingespielt: ${docs.length} Einträge.`);
  }catch(e){ toast(failMsg(e)); }
}

/* ---------- Übungsstatistik (Deep Dive) ---------- */
function openStats(name){
  if(S.active && S.tab === "train" && S.trainView !== "finish"){ S.settings.statsUses = (S.settings.statsUses || 0) + 1; saveSettings(); }
  S.dd ={name, metric: isTime(name) ? "t" : "e1", gran:"s", period:"all"}; openSheet(renderDD); }
function renderDD(){
  const d = S.dd; if(!d) return "";
  const t = isTime(d.name), info = exInfo(d.name), allS = exSessions(d.name);
  const dps = periodStart(d.period || "all"), ss = dps ? allS.filter(s => parseD(s.date) >= dps) : allS;
  const head = `<div class="row"><div class="grow"><span class="small">Statistik · ${esc(info.group)}</span><h2 style="font-size:28px">${esc(d.name)}</h2></div><button class="icon" data-act="close-sheet" aria-label="Schließen">${icon("x")}</button></div>`;
  if(!allS.length) return head + `<p class="muted">Für diese Übung gibt es noch keine gespeicherten Sätze. Nach deinem ersten Training mit ihr siehst du hier 1RM, Volumen und PRs.</p>`;
  const periodSeg = `<div class="seg" role="tablist" aria-label="Zeitraum">${PERIODS.map(([k,l]) => `<button role="tab" aria-selected="${(d.period||"all")===k}" class="${(d.period||"all")===k?"on":""}" data-act="dd-period" data-p="${k}" style="padding:0 4px;font-size:13px">${l}</button>`).join("")}</div>`;
  const noPeriodData = `<p class="muted">In diesem Zeitraum hast du ${esc(d.name)} nicht trainiert. Zuletzt am ${esc(fmtDate(allS[allS.length-1].date,{day:"numeric",month:"long",year:"numeric"}))}. Wähle einen längeren Zeitraum.</p>`;
  const last = allS[allS.length-1], prevS = allS[allS.length-2];
  let html = head;
  if(t){
    const best = allS.reduce((b,s) => (s.bestT||0) > (b.bestT||0) ? s : b, allS[0]);
    html += `<div class="tiles">
      <div class="tile acc"><span class="n">${fmtSec(best.bestT)}</span><span class="t">Bestzeit · ${esc(fmtShort(best.date))}</span></div>
      <div class="tile"><span class="n">${fmtSec(last.bestT)}</span><span class="t">Zuletzt</span></div>
      <div class="tile"><span class="n">${fmtSec(last.totT)}</span><span class="t">Gesamtzeit zuletzt</span></div></div>`;
    html += periodSeg;
    if(!ss.length) return html + noPeriodData;
    const pts = ss.map(s => ({label:fmtShort(s.date), y:s.bestT, sub:`gesamt ${fmtSec(s.totT)}`, wid:s.wid}));
    html += `<section class="card"><h3>Beste Zeit pro Einheit</h3>${chart("dd", pts, {fmt:fmtSec, tick:v => fmt(v,0)+"s", trendUnit:"Einheit", aria:"Beste Zeit"})}</section>`;
  } else {
    const allBest = Math.max(0, ...ss.map(s => s.best1 || 0));
    /* Kennzahlen über alle Einheiten: geschätztes 1RM, Maximalgewicht, Top-3-Wiederholungsrekorde */
    const allSets = allS.flatMap(s => s.sets.map(x => ({...x, date:s.date, wid:s.wid})));
    const wSets = allSets.filter(x => x.w > 0 && x.r > 0).map(x => ({...x, e: e1rm(x.w, x.r) || x.w}));
    const best1All = Math.max(0, ...allS.map(s => s.best1 || 0)), best1S = allS.find(s => (s.best1 || 0) === best1All);
    const maxSet = wSets.reduce((b, x) => !b || x.w > b.w || (x.w === b.w && x.r > b.r) ? x : b, null);
    const ch = prevS && last.best1 && prevS.best1 ? last.best1 - prevS.best1 : null;
    let top = [];
    if(wSets.length){ const seen = new Set(); for(const x of [...wSets].sort((a, b) => b.e - a.e || b.w - a.w)){ if(seen.has(x.r)) continue; seen.add(x.r); top.push(x); if(top.length === 3) break; } }
    else { top = [...allSets].filter(x => x.r > 0).sort((a, b) => b.r - a.r).slice(0, 3); }
    html += `<div class="tiles two">
      <div class="tile acc"><span class="n">${best1All ? fmt(best1All) + " kg" : "–"}</span><span class="t">1RM geschätzt (Bestwert${best1S ? " · " + esc(fmtShort(best1S.date)) : ""})</span>${last.best1 ? `<span class="d small">aktuell ${fmt(last.best1)} kg${ch != null ? ` <span class="${ch >= 0 ? "up" : "down"}">(${ch >= 0 ? "+" : ""}${fmt(ch)})</span>` : ""}</span>` : ""}</div>
      <div class="tile"><span class="n">${maxSet ? fmt(maxSet.w) + " kg" : "–"}</span><span class="t">Maximalgewicht${maxSet ? " · " + esc(fmtShort(maxSet.date)) : ""}</span>${maxSet ? `<span class="d small">${fmt(maxSet.r,0)} ${plural(maxSet.r,"Wiederholung","Wiederholungen")}</span>` : ""}</div>
    </div>
    <section class="card"><h3>Wiederholungsrekorde</h3>
      ${top.length ? `<div class="toprecs">${top.map((x, i) => `<button class="toprec" data-act="chart-open" data-id="${esc(x.wid)}"><span class="trank">${i+1}</span><span class="tval">${fmt(x.r,0)}× ${x.w > 0 ? fmt(x.w) + " kg" : "Körpergewicht"}</span><span class="small">${esc(fmtDate(x.date,{day:"numeric",month:"short",year:"2-digit"}))}${x.e && x.w > 0 ? ` · 1RM ${fmt(x.e)} kg` : ""}</span></button>`).join("")}</div>
      <span class="small">Deine stärksten Sätze, bewertet nach geschätztem 1RM, je Wiederholungszahl einer. Tippen öffnet das Training.</span>` : `<p class="muted">Noch keine Sätze mit Gewicht und Wiederholungen.</p>`}
    </section>`;
    html += periodSeg;
    if(!ss.length) return html + noPeriodData;
    const M = {e1:["1RM","best1",v => fmt(v,1)+" kg"], w:["Max-Gewicht","maxW",v => fmt(v,1)+" kg"], v:["Volumen","vol",fmtKg], i:["Intensität","intensity",v => fmt(v,0)+" %"], a:["Ø kg/Wdh.","avgW",v => fmt(v,1)+" kg"]};
    const [mLabel, field, f] = M[d.metric] || M.e1;
    let pts;
    if(d.gran === "w"){
      const wk = new Map();
      for(const s of ss){ const k = ymd(weekStart(parseD(s.date))); const c = wk.get(k) || {vals:[], vol:0, n:0, bestV:-Infinity, wid:null}; c.n++; if(field === "vol") c.vol += s.vol; else if(s[field] != null) c.vals.push(s[field]); const sv = field === "vol" ? s.vol : s[field]; if(sv != null && sv > c.bestV){ c.bestV = sv; c.wid = s.wid; } wk.set(k, c); }
      pts = [...wk.entries()].map(([k,c]) => ({label:"KW "+isoWeek(parseD(k)), y: field === "vol" ? c.vol : (c.vals.length ? (field === "best1" || field === "maxW" ? Math.max(...c.vals) : avg(c.vals)) : null), sub: c.n + " " + plural(c.n,"Einheit","Einheiten"), wid: c.wid}));
    } else pts = ss.map(s => ({label:fmtShort(s.date), y:s[field], sub: s.sets.filter(x => x.r).map(x => setText(x, d.name)).join(", "), wid:s.wid}));
    html += `<section class="card">
      <div class="seg">${Object.entries(M).map(([k,v]) => `<button class="${d.metric===k?"on":""}" data-act="dd-metric" data-m="${k}" style="padding:0 4px;font-size:13px">${v[0]}</button>`).join("")}</div>
      <div class="row"><h3>${mLabel}</h3><div class="seg" style="width:auto"><button class="${d.gran==="s"?"on":""}" data-act="dd-gran" data-g="s">Einheit</button><button class="${d.gran==="w"?"on":""}" data-act="dd-gran" data-g="w">Woche</button></div></div>
      ${chart("dd", pts, {fmt:f, trendUnit: d.gran === "w" ? "Woche" : "Einheit", tick:v => field === "vol" ? (v >= 10000 ? fmt(v/1000,0)+"t" : fmt(v,0)) : fmt(v,0), type: field === "vol" ? "bar" : "line", aria:mLabel + " im Verlauf"})}
      <span class="small">1RM nach ${S.settings.formula === "brzycki" ? "Brzycki" : "Epley"}. Intensität = Ø Arbeitsgewicht in % deines besten geschätzten 1RM bis zu diesem Tag.</span>
    </section>`;
    /* Rep-PRs */
    const reps = [1,3,5,8,10,12].map(R => { let best = null; for(const s of ss) for(const x of s.sets) if(x.r >= R && x.w > 0 && (!best || x.w > best.w)) best = {w:x.w, r:x.r, date:s.date}; return {R, best}; });
    html += `<section class="card"><h3>PRs nach Wiederholungen${(d.period || "all") !== "all" ? " (im Zeitraum)" : ""}</h3><table class="table">${reps.map(x => `<tr><td>Bestes ${x.R}RM</td><td>${x.best ? `<b>${fmt(x.best.w)} kg</b> <span class="small">· ${esc(fmtShort(x.best.date))}${x.best.r > x.R ? ` (${x.best.r} Wdh.)` : ""}</span>` : `<span class="small">–</span>`}</td></tr>`).join("")}
      <tr><td>Bestes 1RM geschätzt</td><td><b>${fmt(allBest)} kg</b></td></tr></table></section>`;
    /* Max-Gewicht-Historie */
    let mx = 0; const hist = [];
    for(const s of ss) if(s.maxW > mx){ mx = s.maxW; hist.push(s); }
    html += `<section class="card"><h3>Max-Gewicht-Historie${(d.period || "all") !== "all" ? " (im Zeitraum)" : ""}</h3><table class="table">${hist.slice(-6).reverse().map(s => `<tr><td>${esc(fmtDate(s.date,{day:"numeric",month:"short",year:"numeric"}))}</td><td><b>${fmt(s.maxW)} kg</b></td></tr>`).join("")}</table></section>`;
  }
  html += `<section class="card"><h3>Letzte Einheiten</h3><table class="table">${[...ss].reverse().slice(0,6).map(s => `<tr><td>${esc(fmtDate(s.date))}</td><td class="small">${s.sets.map(x => esc(setText(x, d.name))).join(" · ")}</td></tr>`).join("")}</table></section>`;
  return html;
}

const TABS = [["train","Training","plusc"],["hist","Verlauf","cal"],["plans","Pläne","plan"],["prog","Fortschritt","chart"]];
TABS.forEach(([k,l,ic]) => { $("#tab-"+k).innerHTML = icon(ic) + l; });
function showTab(t){
  S.tab = t;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-"+t));
  document.querySelectorAll("nav.tabs button").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.tab); }));
function renderAll(){
  EFF_CACHE = new Map(); PR_CACHE.clear();
  const ae = document.activeElement;
  if(!(ae && $("#v-train").contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA"))) renderTrain();
  renderHist();
  if(!(ae && $("#v-plans").contains(ae) && ae.tagName === "INPUT")) renderPlans();
  if(!(ae && $("#v-prog").contains(ae) && ae.tagName === "INPUT")) renderProg();
  if(S.dd) refreshSheet();
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
  switch(act){
    case "tab": showTab(b.dataset.tab); break;
    case "start-free": startWorkout(null); break;
    case "gate-go": gateGo(b.dataset.plan); break;
    case "start-plan": { const p = S.plans.find(x => x.id === b.dataset.id); if(p){ if(S.active){ toast("Du hast schon ein laufendes Training."); showTab("train"); } else startWorkout(p); } break; }
    case "discard": {
      const a = S.active; const any = a.exercises.some(ex => ex.sets.some(s => s.done || s.w || s.r || s.t));
      if(any && !(await ask(a.editId ? "Änderungen verwerfen?" : "Training abbrechen? Alle Einträge gehen verloren.", a.editId ? "Verwerfen" : "Abbrechen"))) return;
      clearActive(); renderTrain(); break; }
    case "pick": openPicker(b.dataset.ctx); break;
    case "pick-new": { S.pickNew = !S.pickNew; refreshSheet(); if(S.pickNew){ const sb = $("#sheet-body"); if(sb) sb.scrollTop = 0; setTimeout(() => { const i = $("#cx-name"); if(i) i.focus(); }, 60); } break; }
    case "pick-group": { S.pickGroup = b.dataset.g; const l = $("#pick-list"); if(l) l.innerHTML = pickRows(pickList(), allExerciseNames()); document.querySelectorAll(".pickhead .gchips button").forEach(x => x.classList.toggle("on", x.dataset.g === S.pickGroup)); const sb = $("#sheet-body"); if(sb) sb.scrollTop = 0; break; }
    case "pick-ex": choosePicked(b.dataset.name); break;
    case "add-custom": addCustom(); break;
    case "close-sheet": closeSheet(); break;
    case "done": toggleDone(i, j); break;
    case "rir": { const s = S.active.exercises[i].sets[j]; if(await pickRir(s)){ touchActive(); renderTrain(); } break; }
    case "set-menu": setMenu(i, j); break;
    case "ex-menu": exMenu(i); break;
    case "add-set": addSet(i, false); break;
    case "add-warm": addSet(i, true); break;
    case "stats": openStats(b.dataset.name); break;
    case "to-finish": {
      if(!cleanActive().length){ toast("Trag mindestens einen Satz mit Wiederholungen oder Zeit ein."); return; }
      { const m = missingRir(); if(m){ toast(`Bei ${m} ${plural(m,"Arbeitssatz","Arbeitssätzen")} fehlt noch das RIR.`); return; } }
      S.trainView = "finish"; renderTrain(); window.scrollTo(0,0); break; }
    case "back-train": S.trainView = "main"; renderTrain(); break;
    case "rate": S.active.rating = +b.dataset.n; touchActive(); { const y = window.scrollY; renderTrain(); window.scrollTo(0,y); } break;
    case "save-w": saveWorkout(); break;
    case "open-w": openSheet(() => renderWorkoutDetail(b.dataset.id)); break;
    case "edit-w": editWorkout(b.dataset.id); break;
    case "del-w": {
      const w = S.workouts.find(x => x.id === b.dataset.id); if(!w) return;
      if(!(await ask(`Training vom ${fmtDate(w.date)} endgültig löschen?`, "Löschen"))) return;
      try{ await del(w.id); closeSheet(); toast("Training gelöscht."); }catch(err){ toast(failMsg(err)); }
      break; }
    case "hist-mode": S.histMode = b.dataset.m; renderHist(); break;
    case "hist-filter": S.histFilter = b.dataset.f; renderHist(); break;
    case "cal-nav": S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + (+b.dataset.d), 1); S.calSel = null; renderHist(); break;
    case "cal-day": S.calSel = b.dataset.d; renderHist(); break;
    case "export": doExport(b.dataset.t); break;
    case "new-plan": S.planEdit = {id:null, name:"", items:[]}; showTab("plans"); renderPlans(); break;
    case "edit-plan": { const p = S.plans.find(x => x.id === b.dataset.id); if(p){ S.planEdit = JSON.parse(JSON.stringify(p)); renderPlans(); window.scrollTo(0,0); } break; }
    case "plan-cancel": S.planEdit = null; renderPlans(); break;
    case "plan-save": savePlan(); break;
    case "plan-del": { const p = S.planEdit; if(!(await ask(`Plan „${p.name}“ löschen? Deine gespeicherten Trainings bleiben erhalten.`, "Löschen"))) return; try{ await del(p.id); S.planEdit = null; renderPlans(); toast("Plan gelöscht."); }catch(err){ toast(failMsg(err)); } break; }
    case "pi-up": { const it = S.planEdit.items; if(i > 0){ [it[i-1], it[i]] = [it[i], it[i-1]]; renderPlans(); } break; }
    case "pi-down": { const it = S.planEdit.items; if(i < it.length-1){ [it[i+1], it[i]] = [it[i], it[i+1]]; renderPlans(); } break; }
    case "pi-del": S.planEdit.items.splice(i,1); renderPlans(); break;
    case "period": S.period = b.dataset.p; renderProg(); break;
    case "vol-group": S.volGroup = b.dataset.g; renderProg(); break;
    case "dd-metric": S.dd.metric = b.dataset.m; CH.dd = null; refreshSheet(); break;
    case "dd-gran": S.dd.gran = b.dataset.g; CH.dd = null; refreshSheet(); break;
    case "dd-period": S.dd.period = b.dataset.p; CH.dd = null; refreshSheet(); break;
    case "chart-open": openWorkoutFromChart(b.dataset.id); break;
    case "dd-back": { const back = S.ddBack; S.ddBack = null; if(back){ S.dd = back; openSheet(renderDD); } break; }
    case "badge": {
      const bd = BADGES.find(x => x.id === b.dataset.id), on = unlocked().has(bd.id);
      if(bd.secret && !on){ toast(`Geheimes Abzeichen (${TIER[bd.t]}, ${BADGE_XP[bd.t]} XP). Lass dich überraschen!`); break; }
      if(bd.manual){
        const cl = new Set(S.settings.claimed || []);
        const r = await actionSheet(`${bd.name} · ${TIER[bd.t]} · ${BADGE_XP[bd.t]} XP`, [{v:"info", label:bd.desc}, cl.has(bd.id) ? {v:"un", label:"Markierung entfernen", icon:"x", danger:true} : {v:"claim", label:"Geschafft! Als erreicht markieren", icon:"check"}]);
        if(r === "claim"){ cl.add(bd.id); } else if(r === "un"){ cl.delete(bd.id); } else break;
        S.settings.claimed = [...cl]; saveSettings(); renderAll(); refreshSheet();
        toast(r === "claim" ? `„${bd.name}“ freigeschaltet: +${BADGE_XP[bd.t]} XP` : "Markierung entfernt.");
        break;
      }
      toast(`${bd.name} (${TIER[bd.t]}, ${BADGE_XP[bd.t]} XP): ${bd.desc}. ${on ? "Freigeschaltet." : "Noch gesperrt."}`); break; }
    case "all-badges": openSheet(renderAllBadges); break;
    case "hs-info": openSheet(renderHsInfo); break;
    case "wipe-all": wipeAll(); break;
    case "bw-save": {
      const kg = num($("#bw-in").value); if(!(kg > 25 && kg < 400)){ toast("Gib dein Gewicht in kg ein, z. B. 78,4."); return; }
      const d = ($("#bw-date") && $("#bw-date").value) || todayStr();
      if(d > todayStr()){ toast("Das Datum darf nicht in der Zukunft liegen."); return; }
      try{ await put("bw-"+d, {kind:"bw", date:d, kg}); toast(d === todayStr() ? "Körpergewicht eingetragen." : `Körpergewicht für ${fmtDate(d)} eingetragen.`); }catch(err){ toast(failMsg(err)); }
      break; }
    case "bw-del": {
      const entry = S.bw.find(x => x.id === b.dataset.id); if(!entry) return;
      if(!(await ask(`Körpergewicht vom ${fmtDate(entry.date)} (${fmt(entry.kg,1)} kg) löschen?`, "Löschen"))) return;
      try{ await del(entry.id); toast("Eintrag gelöscht."); }catch(err){ toast(failMsg(err)); }
      break; }
  }
});

/* =========================================================
   Start
   ========================================================= */
async function init(){
  S.active = lsGet("tl2-active");
  renderAll();
  let db = null, user = null, id = null;
  try{
    if(window.claude && typeof window.claude.use === "function"){
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      id = user ? await user.id() : null;
    }
  }catch(e){}
  if(db && id){
    DB.mode = "cloud"; DB.col = db.collection("data/users/" + id);
    let first = true;
    const timer = setTimeout(() => { if(first) toast("Deine Daten laden noch. Prüf deine Internetverbindung."); }, 10000);
    DB.col.onSnapshot(snap => {
      if(!snap.metadata.fromCache){ first = false; clearTimeout(timer); }
      ingest(snap.docs.map(d => ({id:d.id, ...d.data()})));
    }, err => { clearTimeout(timer); toast(err && err.code === "revoked" ? "Kein Zugriff mehr auf deine Daten." : "Deine Daten sind gerade nicht erreichbar. Lade die Seite später neu."); });
  } else {
    DB.mode = "local";
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    DB.local = lsGet("tl2-docs") || {};
    DB.activeAdopted = true;
    ingest(Object.entries(DB.local).map(([id,d]) => ({id, ...d})));
  }
}
init();
</script>
